name: DSA

options:
  bundleIdPrefix: com.dihan
  deploymentTarget:
    iOS: "17.0"

configs:
  Debug: debug
  Release: release

targets:
  DSA:
    type: application
    platform: iOS

    sources:
      - path: DSA

    resources:
      - path: DSA/Assets.xcassets

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dihan.DSA
        PRODUCT_NAME: DSA
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: DSA/Info.plist

    info:
      path: DSA/Info.plist
      properties:
        CFBundleDisplayName: Dihan Super App
        CFBundleIdentifier: com.dihan.DSA
        CFBundleName: DSA
        CFBundlePackageType: APPL
        UILaunchScreen: {}
